<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelMate AI</title>

<style>
:root {
  --bg: #06101d;
  --bg-light: #0b1a2d;
  --card: #0e2138;
  --card-light: #142b46;
  --text: #f5f7fa;
  --muted: #879bb3;
  --accent: #55d6ff;
  --accent2: #7a7cff;
  --line: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, #17375b 0%, var(--bg) 48%);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
}

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  position: relative;
}

.screen {
  min-height: 100vh;
  padding: 8px 20px 28px;
  display: none;
}

.screen.active {
  display: flex;
  flex-direction: column;
}

/* =========================
   TOP
========================= */

.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  min-height: 54px;
}

.clock {
  text-align: left;
  color: var(--text);
  line-height: 1.1;
}

.clock .time {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.clock .date {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}

.brand {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin-top: 2px;
}

.brand span {
  color: var(--accent);
}

/* =========================
   HOME
========================= */

.home-title {
  margin-top: 38px;
  margin-bottom: 20px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -1px;
}

.trip-card {
  background: rgba(14,33,56,0.92);
  border: 1px solid var(--line);
  border-radius: 27px;
  padding: 21px;
  box-shadow: 0 18px 55px rgba(0,0,0,0.22);
}

.label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.4px;
}

.route {
  display: grid;
  grid-template-columns: 1fr 28px 1fr;
  align-items: end;
  gap: 8px;
}

.route-arrow {
  color: var(--accent);
  text-align: center;
  font-size: 22px;
  padding-bottom: 5px;
}

input {
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
}

.route input {
  font-size: 18px;
  font-weight: 700;
  padding: 0;
}

.form-grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 10px;
}

.field {
  padding: 13px 14px;
  border-radius: 17px;
  background: rgba(255,255,255,0.045);
}

.field input {
  font-size: 16px;
  font-weight: 600;
}

.people-grid {
  margin-top: 10px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.people-box {
  padding: 13px 14px;
  border-radius: 17px;
  background: rgba(255,255,255,0.045);
}

.people-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.people-control span {
  font-size: 17px;
  font-weight: 700;
}

.counter {
  display: flex;
  align-items: center;
  gap: 10px;
}

.counter button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  font-size: 20px;
}

.search-button {
  width: 100%;
  margin-top: 15px;
  padding: 17px;
  border-radius: 19px;
  background: linear-gradient(135deg, var(--accent), #83e5ff);
  color: #06101d;
  font-weight: 800;
  font-size: 16px;
  box-shadow: 0 10px 30px rgba(85,214,255,0.18);
}

/* =========================
   SAVED TRIPS
========================= */

.saved-section {
  margin-top: 28px;
}

.section-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin: 0 3px 12px;
}

.saved-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.saved-trip {
  width: 100%;
  padding: 15px 16px;
  border-radius: 17px;
  background: rgba(255,255,255,0.045);
  border: 1px solid rgba(255,255,255,0.045);
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.saved-trip:active {
  transform: scale(0.98);
}

.saved-main {
  min-width: 0;
}

.saved-route {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.saved-info {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.saved-arrow {
  color: var(--muted);
  font-size: 18px;
  margin-left: 10px;
}

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 5px 3px;
}

/* =========================
   TRAVELMATE SCREEN
========================= */

.screen2 {
  padding-top: 8px;
}

.back-button {
  margin-top: 13px;
  width: 42px;
  height: 42px;
  border-radius: 15px;
  background: rgba(255,255,255,0.07);
  font-size: 21px;
}

.current-trip {
  margin-top: 17px;
  padding: 14px 2px 8px;
}

.current-route {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.current-info {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

.icon-grid {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  row-gap: 25px;
  column-gap: 12px;
}

.icon-button {
  background: transparent;
  text-align: center;
  padding: 3px;
}

.icon-button:active {
  transform: scale(0.92);
}

.icon-symbol {
  width: 54px;
  height: 54px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.icon-symbol svg {
  width: 34px;
  height: 34px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-name {
  display: block;
  margin-top: 7px;
  font-size: 11px;
  color: #d9e1ea;
}

.ask-button {
  width: 100%;
  margin-top: auto;
  padding: 17px;
  border-radius: 19px;
  background: linear-gradient(135deg, var(--accent2), #4bbcff);
  color: white;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 12px 35px rgba(90,100,255,0.18);
}

/* =========================
   TOAST
========================= */

.toast {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 440px;
  padding: 15px 17px;
  border-radius: 17px;
  background: #162c46;
  border: 1px solid var(--line);
  color: white;
  text-align: center;
  font-size: 13px;
  display: none;
}

.toast.show {
  display: block;
}

/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {
  .home-title {
    margin-top: 20px;
  }

  .icon-grid {
    margin-top: 18px;
    row-gap: 14px;
  }

  .saved-section {
    margin-top: 18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================
       SCREEN 1 — HOME
  ====================== -->

  <section id="home" class="screen active">

    <div class="top">

      <div class="clock">
        <div class="time" id="time">UTC 00:00</div>
        <div class="date" id="date">01 Jan 2026</div>
      </div>

      <div class="brand">
        TravelMate <span>AI</span>
      </div>

    </div>


    <div class="home-title">
      New Trip
    </div>


    <div class="trip-card">

      <div class="route">

        <div>
          <span class="label">FROM</span>
          <input id="from" value="Kaliningrad">
        </div>

        <div class="route-arrow">
          →
        </div>

        <div>
          <span class="label">TO</span>
          <input id="to" value="Goa, India">
        </div>

      </div>


      <div class="form-grid">

        <div class="field">
          <span class="label">DATE</span>
          <input id="tripDate" type="date">
        </div>

        <div class="field">
          <span class="label">DAYS</span>
          <input id="days" type="number" min="1" value="90">
        </div>

      </div>


      <div class="people-grid">

        <div class="people-box">

          <span class="label">ADULTS</span>

          <div class="people-control">

            <div class="counter">
              <button onclick="changePeople('adults', -1)">−</button>
              <span id="adults">2</span>
              <button onclick="changePeople('adults', 1)">+</button>
            </div>

          </div>

        </div>


        <div class="people-box">

          <span class="label">CHILDREN</span>

          <div class="people-control">

            <div class="counter">
              <button onclick="changePeople('children', -1)">−</button>
              <span id="children">3</span>
              <button onclick="changePeople('children', 1)">+</button>
            </div>

          </div>

        </div>

      </div>


      <button class="search-button" onclick="createTrip()">
        SEARCH
      </button>

    </div>


    <div class="saved-section">

      <div class="section-label">
        SAVED TRIPS
      </div>

      <div id="savedTrips" class="saved-list"></div>

    </div>

  </section>


  <!-- =====================
       SCREEN 2 — TRAVELMATE
  ====================== -->

  <section id="travelmate" class="screen screen2">

    <div class="top">

      <div class="clock">
        <div class="time" id="time2">UTC 00:00</div>
        <div class="date" id="date2">01 Jan 2026</div>
      </div>

      <div class="brand">
        TravelMate <span>AI</span>
      </div>

    </div>


    <button class="back-button" onclick="goHome()">
      ←
    </button>


    <div class="current-trip">

      <div class="current-route" id="currentRoute">
        Kaliningrad → Goa, India
      </div>

      <div class="current-info" id="currentInfo">
        90 days · 2 adults · 3 children
      </div>

    </div>


    <!-- iPhone-like icon grid -->

    <div class="icon-grid">


      <!-- PACKING -->

      <button class="icon-button"
              onclick="featureMessage('Packing')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <path d="M6 7h12l1 14H5L6 7z"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
            <path d="M9 11v6"/>
            <path d="M15 11v6"/>
          </svg>
        </div>

        <span class="icon-name">Packing</span>

      </button>


      <!-- WEATHER -->

      <button class="icon-button"
              onclick="featureMessage('Weather')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="14" r="4"/>
            <path d="M13 14h3a4 4 0 0 0 0-8 5 5 0 0 0-9-1"/>
            <path d="M17 16v4"/>
            <path d="M20 17l-2 3"/>
            <path d="M14 17l2 3"/>
          </svg>
        </div>

        <span class="icon-name">Weather</span>

      </button>


      <!-- TICKETS -->

      <button class="icon-button"
              onclick="featureMessage('Tickets')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <path d="M3 8a2 2 0 0 0 0 4 2 2 0 0 0 0 4v3h18v-3a2 2 0 0 0 0-4 2 2 0 0 0 0-4V5H3v3z"/>
            <path d="M13 5v14"/>
          </svg>
        </div>

        <span class="icon-name">Tickets</span>

      </button>


      <!-- DOCUMENTS -->

      <button class="icon-button"
              onclick="featureMessage('Documents')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <path d="M6 3h9l4 4v14H6z"/>
            <path d="M15 3v5h4"/>
            <path d="M9 13h6"/>
            <path d="M9 17h6"/>
          </svg>
        </div>

        <span class="icon-name">Documents</span>

      </button>


      <!-- MONEY -->

      <button class="icon-button"
              onclick="featureMessage('Money')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M14.5 8.5c-.7-.7-1.7-1-2.7-1-1.6 0-2.8.8-2.8 2s1 1.8 2.8 2.2c1.8.4 2.8 1 2.8 2.2s-1.2 2-2.8 2c-1.1 0-2.2-.4-2.9-1.1"/>
            <path d="M12 5.5v13"/>
          </svg>
        </div>

        <span class="icon-name">Money</span>

      </button>


      <!-- MOBILE -->

      <button class="icon-button"
              onclick="featureMessage('Mobile')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="2.5" width="12" height="19" rx="2"/>
            <path d="M10 5h4"/>
            <circle cx="12" cy="18.5" r="0.8"/>
          </svg>
        </div>

        <span class="icon-name">Mobile</span>

      </button>


      <!-- ALERTS -->

      <button class="icon-button"
              onclick="featureMessage('Alerts')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
        </div>

        <span class="icon-name">Alerts</span>

      </button>


      <!-- HELP -->

      <button class="icon-button"
              onclick="featureMessage('Help')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9.5 9a2.6 2.6 0 1 1 4.7 1.6c-.8 1-2.2 1.2-2.2 2.8"/>
            <path d="M12 17h.01"/>
          </svg>
        </div>

        <span class="icon-name">Help</span>

      </button>


      <!-- ROUTE -->

      <button class="icon-button"
              onclick="featureMessage('Route')">

        <div class="icon-symbol">
          <svg viewBox="0 0 24 24">
            <circle cx="7" cy="17" r="2"/>
            <circle cx="17" cy="7" r="2"/>
            <path d="M8.5 15.5c2-2 2-5 4-7s3-1.5 3-1.5"/>
          </svg>
        </div>

        <span class="icon-name">Route</span>

      </button>

    </div>


    <button class="ask-button" onclick="askTravelMate()">
      ASK TRAVELMATE
    </button>


    <div class="saved-section">

      <div class="section-label">
        SAVED TRIPS
      </div>

      <div id="savedTrips2" class="saved-list"></div>

    </div>

  </section>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   STATE
========================= */

let people = {
  adults: 2,
  children: 3
};

let currentTrip = null;


/* =========================
   CLOCK
========================= */

function updateClock() {

  const now = new Date();

  const utcTime =
    now.toLocaleTimeString("en-GB", {
      timeZone: "UTC",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });

  const utcDate =
    now.toLocaleDateString("en-GB", {
      timeZone: "UTC",
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

  document.getElementById("time").textContent =
    "UTC " + utcTime;

  document.getElementById("date").textContent =
    utcDate;

  document.getElementById("time2").textContent =
    "UTC " + utcTime;

  document.getElementById("date2").textContent =
    utcDate;
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   PEOPLE
========================= */

function changePeople(type, amount) {

  people[type] += amount;

  if (type === "adults" && people[type] < 1) {
    people[type] = 1;
  }

  if (type === "children" && people[type] < 0) {
    people[type] = 0;
  }

  document.getElementById(type).textContent =
    people[type];
}


/* =========================
   SAVE TRIP
========================= */

function createTrip() {

  const from =
    document.getElementById("from").value.trim();

  const to =
    document.getElementById("to").value.trim();

  const date =
    document.getElementById("tripDate").value;

  const days =
    Number(document.getElementById("days").value);


  if (!from || !to || !date || !days) {

    showMessage(
      "Please complete your trip details."
    );

    return;
  }


  const trip = {

    id: Date.now(),

    from: from,

    to: to,

    date: date,

    days: days,

    adults: people.adults,

    children: people.children

  };


  let trips =
    JSON.parse(
      localStorage.getItem("travelMateTrips") || "[]"
    );


  trips.unshift(trip);


  /* Keep last 10 trips */

  trips = trips.slice(0, 10);


  localStorage.setItem(
    "travelMateTrips",
    JSON.stringify(trips)
  );


  openTrip(trip);

  renderSavedTrips();

}


/* =========================
   OPEN TRIP
========================= */

function openTrip(trip) {

  currentTrip = trip;


  document.getElementById("currentRoute").textContent =
    trip.from + " → " + trip.to;


  document.getElementById("currentInfo").textContent =
    formatDate(trip.date) +
    " · " +
    trip.days +
    " days · " +
    trip.adults +
    " adults · " +
    trip.children +
    " children";


  document.getElementById("home")
    .classList.remove("active");

  document.getElementById("travelmate")
    .classList.add("active");

  window.scrollTo(0, 0);
}


/* =========================
   HOME
========================= */

function goHome() {

  document.getElementById("travelmate")
    .classList.remove("active");

  document.getElementById("home")
    .classList.add("active");

  window.scrollTo(0, 0);

}


/* =========================
   SAVED TRIPS
========================= */

function renderSavedTrips() {

  const containers = [

    document.getElementById("savedTrips"),

    document.getElementById("savedTrips2")

  ];


  let trips =
    JSON.parse(
      localStorage.getItem("travelMateTrips") || "[]"
    );


  containers.forEach(container => {

    container.innerHTML = "";


    if (trips.length === 0) {

      container.innerHTML =
        '<div class="empty">No saved trips yet.</div>';

      return;

    }


    trips.forEach(trip => {

      const button =
        document.createElement("button");

      button.className = "saved-trip";


      button.innerHTML = `

        <div class="saved-main">

          <div class="saved-route">
            ${escapeHtml(trip.from)}
            →
            ${escapeHtml(trip.to)}
          </div>

          <div class="saved-info">
            ${formatDate(trip.date)}
            · ${trip.days} days
            · ${trip.adults} adults
            · ${trip.children} children
          </div>

        </div>

        <div class="saved-arrow">
          ›
        </div>

      `;


      button.onclick = () => openTrip(trip);


      container.appendChild(button);

    });

  });

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(value) {

  const date =
    new Date(value + "T00:00:00");

  return date.toLocaleDateString(
    "en-GB",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );
}


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   FEATURES
========================= */

function featureMessage(name) {

  showMessage(
    name +
    " will be connected to TravelMate."
  );

}


/* =========================
   AI BUTTON
========================= */

function askTravelMate() {

  showMessage(
    "TravelMate AI will be connected here."
  );

}


/* =========================
   TOAST
========================= */

function showMessage(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");


  setTimeout(() => {

    toast.classList.remove("show");

  }, 2800);

}


/* =========================
   START
========================= */

renderSavedTrips();

</script>

</body>
</html>
