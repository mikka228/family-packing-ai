<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TravelMate AI</title>

<style>

:root {
  --bg: #020b18;
  --bg2: #061a31;
  --card: rgba(13, 39, 69, 0.78);
  --card2: rgba(17, 48, 82, 0.82);

  --text: #f7f9fc;
  --muted: #8ea8c4;
  --soft: #b9cee2;

  --blue: #42d8ff;
  --blue2: #4ca8ff;
  --purple: #654cff;

  --border: rgba(130, 190, 255, 0.18);
  --border2: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Arial,
    sans-serif;

  background:

    radial-gradient(
      circle at 50% -15%,
      rgba(39,112,183,.42),
      transparent 42%
    ),

    radial-gradient(
      circle at 20% 70%,
      rgba(23,78,130,.18),
      transparent 40%
    ),

    #020b18;

  color: var(--text);

  min-height: 100vh;
}

button,
input {
  font-family: inherit;
}

button {
  border: 0;
  outline: none;
}

input {
  outline: none;
}


/* =====================================================
   APP
===================================================== */

.app {

  width: 100%;
  max-width: 480px;
  min-height: 100vh;

  margin: auto;

  position: relative;

  overflow: hidden;
}


/* =====================================================
   SCREEN
===================================================== */

.screen {

  min-height: 100vh;

  padding:
    10px
    18px
    30px;

  display: none;

  position: relative;
}

.screen.active {
  display: flex;
  flex-direction: column;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  min-height: 65px;

  position: relative;

  z-index: 5;
}

.time-block {

  display: flex;
  flex-direction: column;

  line-height: 1.15;
}

.time {

  font-size: 15px;

  font-weight: 600;

  letter-spacing: .1px;
}

.date {

  margin-top: 7px;

  font-size: 13px;

  color: var(--soft);
}

.utc {

  margin-top: 3px;

  font-size: 12px;

  color: var(--muted);
}


.brand {

  margin-top: 4px;

  font-size: 17px;

  font-weight: 700;

  letter-spacing: -.5px;
}

.brand span {
  color: var(--blue);
}


/* =====================================================
   HOME TITLE
===================================================== */

.home-title {

  margin-top: 45px;

  font-size: 39px;

  font-weight: 500;

  letter-spacing: -1.8px;
}


/* =====================================================
   NEW TRIP CARD
===================================================== */

.trip-card {

  margin-top: 25px;

  padding: 23px 17px 17px;

  border-radius: 29px;

  background:

    linear-gradient(
      145deg,
      rgba(18,54,91,.86),
      rgba(8,28,51,.88)
    );

  border: 1px solid var(--border);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 25px 70px rgba(0,0,0,.25);
}


/* =====================================================
   ROUTE
===================================================== */

.route {

  display: grid;

  grid-template-columns:
    1fr
    30px
    1fr;

  align-items: end;

  gap: 6px;
}

.route-block {
  min-width: 0;
}

.field-label {

  display: block;

  margin-bottom: 9px;

  font-size: 10px;

  font-weight: 600;

  color: var(--soft);

  letter-spacing: .8px;
}

.route-input {

  width: 100%;

  border: 0;

  background: transparent;

  color: white;

  font-size: 17px;

  font-weight: 600;

  padding: 0;

  min-width: 0;
}

.route-arrow {

  color: var(--blue);

  font-size: 27px;

  text-align: center;

  padding-bottom: 1px;
}


/* =====================================================
   FORM ROW
===================================================== */

.form-row {

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 10px;

  margin-top: 22px;
}

.field-card {

  min-height: 80px;

  padding: 13px 15px;

  border-radius: 20px;

  background:
    rgba(25,62,99,.63);

  border:
    1px solid rgba(112,176,232,.11);
}

.field-value {

  color: white;

  font-size: 16px;

  font-weight: 600;

  width: 100%;

  border: 0;

  background: transparent;
}

.field-value[type="date"] {
  color-scheme: dark;
}

.field-value[type="number"] {
  appearance: textfield;
}

.field-value::-webkit-inner-spin-button {
  display: none;
}


/* =====================================================
   PEOPLE
===================================================== */

.people-row {

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 10px;

  margin-top: 10px;
}

.people-card {

  min-height: 105px;

  padding: 13px 15px;

  border-radius: 20px;

  background:
    rgba(25,62,99,.63);

  border:
    1px solid rgba(112,176,232,.11);
}

.people-bottom {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 9px;
}

.people-number {

  font-size: 20px;

  font-weight: 600;
}

.counter {

  display: flex;

  align-items: center;

  gap: 7px;
}

.counter button {

  width: 31px;
  height: 31px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.09);

  color: white;

  font-size: 20px;

  line-height: 1;
}

.counter button:active {
  transform: scale(.91);
}

.children-info {

  margin-top: 5px;

  color: var(--muted);

  font-size: 11px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-button {

  width: 100%;

  height: 61px;

  margin-top: 15px;

  border-radius: 31px;

  background:

    linear-gradient(
      105deg,
      #13c9f4,
      #467fff 60%,
      #704cff
    );

  color: white;

  font-size: 18px;

  font-weight: 600;

  box-shadow:
    0 12px 35px rgba(45,129,255,.25);

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;
}

.search-button:active {
  transform: scale(.98);
}

.search-icon {

  width: 25px;
  height: 25px;

  border: 3px solid white;

  border-radius: 50%;

  position: relative;
}

.search-icon::after {

  content: "";

  position: absolute;

  width: 9px;
  height: 3px;

  background: white;

  right: -7px;
  bottom: -3px;

  transform: rotate(45deg);

  border-radius: 3px;
}


/* =====================================================
   SAVED TRIPS
===================================================== */

.saved-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 33px;

  margin-bottom: 10px;
}

.saved-title {

  font-size: 12px;

  font-weight: 700;

  color: #92b5d6;

  letter-spacing: 1px;
}

.view-all {

  font-size: 12px;

  color: #8fb1d1;
}

.saved-list {

  display: flex;

  flex-direction: column;

  gap: 9px;
}

.saved-trip {

  min-height: 82px;

  padding: 10px 11px;

  border-radius: 19px;

  background:
    linear-gradient(
      120deg,
      rgba(17,49,82,.78),
      rgba(9,31,54,.75)
    );

  border:
    1px solid rgba(107,175,235,.13);

  display: flex;

  align-items: center;

  gap: 12px;

  color: white;

  text-align: left;

  cursor: pointer;
}

.saved-trip:active {
  transform: scale(.985);
}

.trip-thumb {

  width: 66px;
  height: 61px;

  flex-shrink: 0;

  border-radius: 14px;

  overflow: hidden;

  position: relative;

  background:
    linear-gradient(
      150deg,
      #27b8dc,
      #0671a7 45%,
      #f0a84c 46%,
      #f8d58b 64%,
      #1495b5 65%
    );
}

.trip-thumb::before {

  content: "";

  position: absolute;

  width: 25px;
  height: 40px;

  left: 9px;
  top: 4px;

  background: #15724d;

  border-radius: 100% 0 100% 0;

  transform: rotate(-25deg);
}

.trip-thumb::after {

  content: "";

  position: absolute;

  width: 75px;
  height: 25px;

  left: -3px;
  bottom: 0;

  background:
    rgba(255,255,255,.27);

  border-radius: 50%;
}

.saved-content {

  min-width: 0;

  flex: 1;
}

.saved-route {

  font-size: 14px;

  font-weight: 600;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.saved-meta {

  margin-top: 6px;

  color: #8ea9c3;

  font-size: 11px;
}

.saved-arrow {

  color: #87a7c5;

  font-size: 27px;

  padding-right: 3px;
}


/* =====================================================
   DELETE
===================================================== */

.delete-button {

  width: 37px;
  height: 37px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.055);

  color: #a9bfd3;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.delete-button svg {

  width: 18px;
  height: 18px;

  fill: none;

  stroke: currentColor;

  stroke-width: 1.6;

  stroke-linecap: round;

  stroke-linejoin: round;
}

.delete-button:active {
  color: #ff7373;
}


/* =====================================================
   SECOND SCREEN
===================================================== */

.screen2 {

  padding-top: 10px;
}

.screen2 .topbar {
  min-height: 61px;
}

.trip-top {

  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 6px;
}

.back-button {

  width: 49px;
  height: 49px;

  flex-shrink: 0;

  border-radius: 17px;

  background:
    rgba(38,78,116,.68);

  color: white;

  font-size: 30px;

  line-height: 1;
}

.back-button:active {
  transform: scale(.94);
}

.current-trip {

  min-width: 0;

  flex: 1;
}

.current-route {

  font-size: 17px;

  font-weight: 650;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.current-meta {

  margin-top: 6px;

  font-size: 11px;

  color: var(--muted);
}


/* =====================================================
   ICON GRID
===================================================== */

.icon-grid {

  margin-top: 27px;

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 18px 10px;
}

.app-icon {

  min-height: 119px;

  border-radius: 22px;

  background:

    linear-gradient(
      145deg,
      rgba(18,53,88,.91),
      rgba(8,31,54,.92)
    );

  border:
    1px solid rgba(101,170,229,.15);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 10px;

  color: white;
}

.app-icon:active {
  transform: scale(.94);
}

.icon {

  width: 51px;
  height: 51px;

  display: flex;

  justify-content: center;

  align-items: center;

  color: #9cd5ff;
}

.icon svg {

  width: 39px;
  height: 39px;

  fill: none;

  stroke: currentColor;

  stroke-width: 1.45;

  stroke-linecap: round;

  stroke-linejoin: round;

  filter:
    drop-shadow(
      0 0 7px rgba(82,192,255,.13)
    );
}

.icon-label {

  font-size: 13px;

  font-weight: 500;

  color: #f4f7fb;
}


/* =====================================================
   ASK TRAVELMATE
===================================================== */

.ask-button {

  width: 100%;

  height: 61px;

  margin-top: 25px;

  border-radius: 31px;

  background:

    linear-gradient(
      105deg,
      #11c8f3,
      #4b83ff 60%,
      #714cff
    );

  color: white;

  font-size: 17px;

  font-weight: 600;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  box-shadow:
    0 12px 35px rgba(45,129,255,.22);
}

.ask-star {
  font-size: 23px;
}

.ask-button:active {
  transform: scale(.98);
}


/* =====================================================
   MODAL
===================================================== */

.modal {

  position: fixed;

  inset: 0;

  z-index: 100;

  display: none;

  align-items: flex-end;

  justify-content: center;

  padding: 15px;

  background:
    rgba(0,6,15,.68);

  backdrop-filter: blur(13px);
}

.modal.active {
  display: flex;
}

.modal-card {

  width: 100%;

  max-width: 470px;

  max-height: 88vh;

  overflow-y: auto;

  padding: 23px;

  border-radius: 29px;

  background:
    linear-gradient(
      150deg,
      #102d4b,
      #071a2e
    );

  border:
    1px solid var(--border);

  box-shadow:
    0 -15px 70px rgba(0,0,0,.4);
}

.modal-header {

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.modal-title {

  font-size: 22px;

  font-weight: 700;
}

.close {

  width: 37px;
  height: 37px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.07);

  color: white;

  font-size: 23px;
}

.loading {

  padding: 45px 0;

  text-align: center;

  color: var(--muted);
}

.spinner {

  width: 31px;
  height: 31px;

  margin: 0 auto 17px;

  border:
    3px solid rgba(255,255,255,.1);

  border-top-color:
    var(--blue);

  border-radius: 50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }
}

.result {

  margin-top: 20px;
}

.result-category {

  margin-bottom: 22px;
}

.result-title {

  color: var(--blue);

  font-size: 14px;

  font-weight: 700;

  margin-bottom: 9px;
}

.result-subtitle {

  margin-top: 11px;
  margin-bottom: 5px;

  font-size: 13px;

  font-weight: 600;
}

.result-item {

  padding: 9px 0;

  border-bottom:
    1px solid var(--border2);

  color: #dbe7f1;

  font-size: 13px;
}


/* =====================================================
   TOAST
===================================================== */

.toast {

  position: fixed;

  left: 50%;

  bottom: 25px;

  transform:
    translateX(-50%);

  width:
    calc(100% - 40px);

  max-width: 440px;

  padding: 14px 17px;

  border-radius: 17px;

  background:
    #17334f;

  border:
    1px solid var(--border);

  color: white;

  text-align: center;

  font-size: 13px;

  display: none;

  z-index: 300;
}

.toast.show {
  display: block;
}


/* =====================================================
   EARTH EFFECT
===================================================== */

.earth {

  position: absolute;

  left: -20%;

  right: -20%;

  bottom: -110px;

  height: 230px;

  border-radius:
    50% 50% 0 0;

  background:

    radial-gradient(
      ellipse at 50% 20%,
      rgba(54,179,235,.28),
      rgba(8,66,110,.16) 35%,
      transparent 65%
    );

  box-shadow:
    0 -8px 45px
    rgba(57,191,255,.16);

  pointer-events: none;
}

.earth::after {

  content: "";

  position: absolute;

  left: 10%;
  right: 10%;
  top: 28px;

  height: 80px;

  border-radius: 50%;

  border-top:
    2px solid rgba(100,220,255,.2);

  filter:
    blur(1px);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 370px) {

  .screen {
    padding-left: 13px;
    padding-right: 13px;
  }

  .home-title {
    font-size: 34px;
  }

  .app-icon {
    min-height: 108px;
  }

  .icon {
    width: 44px;
    height: 44px;
  }

  .icon svg {
    width: 35px;
    height: 35px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HOME
===================================================== -->

<section
  id="home"
  class="screen active">


  <div class="topbar">

    <div class="time-block">

      <div
        id="localTime"
        class="time">
        00:00
      </div>

      <div
        id="localDate"
        class="date">
        01 Jan 2026
      </div>

      <div
        id="utcTime"
        class="utc">
        UTC 00:00
      </div>

    </div>


    <div class="brand">
      Travel<span>Mate</span> AI
    </div>

  </div>


  <div class="home-title">
    New Trip
  </div>


  <div class="trip-card">


    <!-- ROUTE -->

    <div class="route">

      <div class="route-block">

        <span class="field-label">
          ◉ FROM
        </span>

        <input
          id="from"
          class="route-input"
          value="Kaliningrad">

      </div>


      <div class="route-arrow">
        →
      </div>


      <div class="route-block">

        <span class="field-label">
          ◉ TO
        </span>

        <input
          id="to"
          class="route-input"
          value="Goa, India">

      </div>

    </div>


    <!-- DATE + DAYS -->

    <div class="form-row">


      <div class="field-card">

        <span class="field-label">
          DATE
        </span>

        <input
          id="tripDate"
          class="field-value"
          type="date">

      </div>


      <div class="field-card">

        <span class="field-label">
          DAYS
        </span>

        <input
          id="days"
          class="field-value"
          type="number"
          min="1"
          value="90">

      </div>

    </div>


    <!-- PEOPLE -->

    <div class="people-row">


      <div class="people-card">

        <span class="field-label">
          ADULTS
        </span>

        <div class="people-bottom">

          <div
            id="adults"
            class="people-number">
            2
          </div>

          <div class="counter">

            <button
              onclick="changePeople('adults',-1)">
              −
            </button>

            <button
              onclick="changePeople('adults',1)">
              +
            </button>

          </div>

        </div>

      </div>


      <div class="people-card">

        <span class="field-label">
          CHILDREN
        </span>

        <div class="people-bottom">

          <div
            id="children"
            class="people-number">
            3
          </div>

          <div class="counter">

            <button
              onclick="changePeople('children',-1)">
              −
            </button>

            <button
              onclick="changePeople('children',1)">
              +
            </button>

          </div>

        </div>

        <div class="children-info">
          Family trip
        </div>

      </div>

    </div>


    <!-- SEARCH -->

    <button
      class="search-button"
      onclick="createTrip()">

      <span class="search-icon"></span>

      Search

    </button>

  </div>


  <!-- SAVED -->

  <div class="saved-header">

    <div class="saved-title">
      SAVED TRIPS
    </div>

    <div class="view-all">
      View all ›
    </div>

  </div>


  <div
    id="savedTrips"
    class="saved-list">
  </div>


  <div class="earth"></div>

</section>


<!-- =====================================================
     SECOND SCREEN
===================================================== -->

<section
  id="travelmate"
  class="screen screen2">


  <div class="topbar">

    <div class="time-block">

      <div
        id="localTime2"
        class="time">
        00:00
      </div>

      <div
        id="localDate2"
        class="date">
        01 Jan 2026
      </div>

      <div
        id="utcTime2"
        class="utc">
        UTC 00:00
      </div>

    </div>


    <div class="brand">
      Travel<span>Mate</span> AI
    </div>

  </div>


  <!-- ROUTE HEADER -->

  <div class="trip-top">


    <button
      class="back-button"
      onclick="goHome()">

      ‹

    </button>


    <div class="current-trip">

      <div
        id="currentRoute"
        class="current-route">

        Kaliningrad → Goa, India

      </div>

      <div
        id="currentMeta"
        class="current-meta">

        90 days · 2 adults · 3 children

      </div>

    </div>

  </div>


  <!-- ICONS -->

  <div class="icon-grid">


    <!-- PACKING -->

    <button
      class="app-icon"
      onclick="openPacking()">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <rect
            x="5"
            y="7"
            width="14"
            height="14"
            rx="2"/>

          <path
            d="M9 7V5a3 3 0 0 1 6 0v2"/>

          <path
            d="M9 11v6"/>

          <path
            d="M15 11v6"/>

        </svg>

      </div>

      <div class="icon-label">
        Packing
      </div>

    </button>


    <!-- WEATHER -->

    <button
      class="app-icon"
      onclick="feature('Weather')">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <circle
            cx="9"
            cy="14"
            r="4"/>

          <path
            d="M13 14h3a4 4 0 0 0 0-8 5 5 0 0 0-9-1"/>

          <path d="M17 17v4"/>

          <path d="M14.5 18.5l-2 2"/>

          <path d="M19.5 18.5l2 2"/>

        </svg>

      </div>

      <div class="icon-label">
        Weather
      </div>

    </button>


    <!-- TICKETS -->

    <button
      class="app-icon"
      onclick="feature('Tickets')">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4V7z"/>

          <path
            d="M12 7v12"/>

        </svg>

      </div>

    <!-- ALERTS -->

    <button

      onclick="feature('Alerts')">

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>

          <path
            d="M10 21h4"/>

        </svg>

      <div class="icon-label">

    <!-- HELP -->

    <button

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <circle

          <path

    <button

  <!-- SAVED AGAIN -->

  <div class="saved-header">

<!-- =====================================================
     PACKING MODAL
===================================================== -->

<div
  id="packingModal"
  class="modal">

  <div class="modal-card">


    <div class="modal-header">

      <div>

        <div class="modal-title">
          Packing
        </div>

      </div>

      <button
        class="close"
        onclick="closePacking()">

        ×

      </button>

    </div>


    <div
      id="packingLoading"
      class="loading">

      <div class="spinner"></div>

      TravelMate is analyzing your trip...

    </div>


    <div
      id="packingResult"
      class="result">
    </div>

  </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast">
</div>


<script>

/* =====================================================
   STATE
===================================================== */

let people = {

  adults: 2,

  children: 3

};

let currentTrip = null;


/* =====================================================
   DEFAULT DATE
===================================================== */

const today =
  new Date();

const yyyy =
  today.getFullYear();

const mm =
  String(
    today.getMonth() + 1
  ).padStart(2,"0");

const dd =
  String(
    today.getDate()
  ).padStart(2,"0");

document.getElementById(
  "tripDate"
).value =
  `${yyyy}-${mm}-${dd}`;


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

  const now =
    new Date();


  const localTime =
    now.toLocaleTimeString(
      "en-GB",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  const localDate =
    now.toLocaleDateString(
      "en-GB",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );


  const utcTime =
    now.toLocaleTimeString(
      "en-GB",
      {
        timeZone: "UTC",
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  document.getElementById(
    "localTime"
  ).textContent =
    localTime;


  document.getElementById(
    "localDate"
  ).textContent =
    localDate;


  document.getElementById(
    "utcTime"
  ).textContent =
    "UTC " + utcTime;


  document.getElementById(
    "localTime2"
  ).textContent =
    localTime;


  document.getElementById(
    "localDate2"
  ).textContent =
    localDate;


  document.getElementById(
    "utcTime2"
  ).textContent =
    "UTC " + utcTime;
}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =====================================================
   PEOPLE
===================================================== */

function changePeople(
  type,
  amount
) {

  people[type] += amount;


  if (
    type === "adults" &&
    people[type] < 1
  ) {

    people[type] = 1;

  }


  if (
    type === "children" &&
    people[type] < 0
  ) {

    people[type] = 0;

  }


  document.getElementById(
    type
  ).textContent =
    people[type];
}


/* =====================================================
   CREATE TRIP
===================================================== */

function createTrip() {

  const from =
    document.getElementById(
      "from"
    ).value.trim();


  const to =
    document.getElementById(
      "to"
    ).value.trim();


  const date =
    document.getElementById(
      "tripDate"
    ).value;


  const days =
    Number(
      document.getElementById(
        "days"
      ).value
    );


  if (
    !from ||
    !to ||
    !date ||
    !days
  ) {

    showToast(
      "Please complete your trip."
    );

    return;
  }


  const trip = {

    id: Date.now(),

    from,

    to,

    date,

    days,

    adults:
      people.adults,

    children:
      people.children

  };


  let trips =
    JSON.parse(
      localStorage.getItem(
        "travelMateTrips"
      ) || "[]"
    );


  trips.unshift(
    trip
  );


  trips =
    trips.slice(
      0,
      10
    );


  localStorage.setItem(
    "travelMateTrips",
    JSON.stringify(trips)
  );


  openTrip(trip);

  renderTrips();
}


/* =====================================================
   OPEN TRIP
===================================================== */

function openTrip(
  trip
) {

  currentTrip =
    trip;


  document.getElementById(
    "currentRoute"
  ).textContent =

    trip.from +
    " → " +
    trip.to;


  document.getElementById(
    "currentMeta"
  ).textContent =

    formatDate(
      trip.date
    ) +

    " · " +

    trip.days +

    " days · " +

    trip.adults +

    " adults · " +

    trip.children +

    " children";


  document.getElementById(
    "home"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "travelmate"
  ).classList.add(
    "active"
  );


  window.scrollTo(
    0,
    0
  );
}


/* =====================================================
   HOME
===================================================== */

function goHome() {

  document.getElementById(
    "travelmate"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "home"
  ).classList.add(
    "active"
  );


  window.scrollTo(
    0,
    0
  );
}


/* =====================================================
   RENDER SAVED TRIPS
===================================================== */

function renderTrips() {

  const containers = [

    document.getElementById(
      "savedTrips"
    ),

    document.getElementById(
      "savedTrips2"
    )

  ];


  let trips =
    JSON.parse(
      localStorage.getItem(
        "travelMateTrips"
      ) || "[]"
    );


  containers.forEach(
    container => {

      container.innerHTML =
        "";


      if (
        trips.length === 0
      ) {

        container.innerHTML = `

          <div
            style="
              color:#829bb4;
              font-size:13px;
              padding:6px 2px;
            "
          >
            No saved trips yet.
          </div>

        `;

        return;

      }


      trips.forEach(
        trip => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "saved-trip";


          row.innerHTML = `

            <div
              class="trip-thumb">
            </div>


            <div
              class="saved-content">

              <div
                class="saved-route">

                ${escapeHtml(
                  trip.from
                )}

                →

                ${escapeHtml(
                  trip.to
                )}

              </div>


              <div
                class="saved-meta">

                ${formatDate(
                  trip.date
                )}

                ·

                ${trip.days}
                days

              </div>

            </div>


            <div
              class="saved-arrow">

              ›

            </div>


            <button
              class="delete-button"
              aria-label="Delete trip">

              <svg
                viewBox="0 0 24 24">

                <path
                  d="M4 7h16"/>

                <path
                  d="M9 7V4h6v3"/>

                <path
                  d="M7 7l1 14h8l1-14"/>

                <path
                  d="M10 11v6"/>

                <path
                  d="M14 11v6"/>

              </svg>

            </button>

          `;


          row.onclick =
            () =>
              openTrip(trip);


          const deleteButton =
            row.querySelector(
              ".delete-button"
            );


          deleteButton.onclick =
            event => {

              event.stopPropagation();

              deleteTrip(
                trip.id
              );

            };


          container.appendChild(
            row
          );

        }
      );

    }
  );
}


/* =====================================================
   DELETE
===================================================== */

function deleteTrip(
  id
) {

  if (
    !confirm(
      "Delete this trip?"
    )
  ) {

    return;

  }


  let trips =
    JSON.parse(
      localStorage.getItem(
        "travelMateTrips"
      ) || "[]"
    );


  trips =
    trips.filter(
      trip =>
        trip.id !== id
    );


  localStorage.setItem(
    "travelMateTrips",
    JSON.stringify(trips)
  );


  renderTrips();


  showToast(
    "Trip deleted."
  );
}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(
  value
) {

  const date =
    new Date(
      value +
      "T00:00:00"
    );


  return date.toLocaleDateString(
    "en-GB",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   PLACEHOLDER FEATURES
===================================================== */

function feature(
  name
) {

  showToast(
    name +
    " is ready to be connected."
  );

}


function askTravelMate() {

  showToast(
    "TravelMate AI will live here."
  );

}


/* =====================================================
   PACKING
===================================================== */

function openPacking() {

  if (!currentTrip) {

    showToast(
      "Please select a trip first."
    );

    return;

  }


  const modal =
    document.getElementById(
      "packingModal"
    );


  const loading =
    document.getElementById(
      "packingLoading"
    );


  const result =
    document.getElementById(
      "packingResult"
    );


  loading.style.display =
    "block";


  result.innerHTML =
    "";


  modal.classList.add(
    "active"
  );


  fetch(
    "/api/packing",
    {

      method: "POST",

      headers: {

        "Content-Type":
          "application/json"

      },

      body:
        JSON.stringify(
          currentTrip
        )

    }
  )

  .then(
    response => {

      if (!response.ok) {

        throw new Error(
          "AI request failed"
        );

      }

      return response.json();

    }
  )

  .then(
    data => {

      loading.style.display =
        "none";

      renderPacking(
        data.result
      );

    }
  )

  .catch(
    error => {

      console.error(
        error
      );


      loading.style.display =
        "none";


      result.innerHTML = `

        <div
          class="result-category">

          <div
            class="result-title">

            TravelMate AI

          </div>

          <div
            class="result-item">

            AI connection is not
            available yet.

            <br><br>

            We will connect it
            after the interface
            is finished.

          </div>

        </div>

      `;

    }
  );

}


/* =====================================================
   CLOSE PACKING
===================================================== */

function closePacking() {

  document.getElementById(
    "packingModal"
  ).classList.remove(
    "active"
  );

}


/* =====================================================
   RENDER PACKING
===================================================== */

function renderPacking(
  raw
) {

  const result =
    document.getElementById(
      "packingResult"
    );


  let data;


  try {

    const clean =
      raw
        .replace(
          /```json/gi,
          ""
        )
        .replace(
          /```/g,
          ""
        )
        .trim();


    data =
      JSON.parse(
        clean
      );

  }

  catch {

    result.innerHTML = `

      <div
        class="result-item">

        ${escapeHtml(raw)}

      </div>

    `;

    return;

  }


  result.innerHTML =
    "";


  Object.entries(
    data
  ).forEach(
    ([category, items]) => {


      const block =
        document.createElement(
          "div"
        );


      block.className =
        "result-category";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "result-title";


      title.textContent =
        category;


      block.appendChild(
        title
      );


      if (
        Array.isArray(items)
      ) {

        items.forEach(
          item => {

            const row =
              document.createElement(
                "div"
              );


            row.className =
              "result-item";


            row.textContent =
              "✓ " + item;


            block.appendChild(
              row
            );

          }
        );

      }


      else if (
        typeof items ===
        "object"
      ) {

        Object.entries(
          items
        ).forEach(
          ([sub, list]) => {


            const subtitle =
              document.createElement(
                "div"
              );


            subtitle.className =
              "result-subtitle";


            subtitle.textContent =
              sub;


            block.appendChild(
              subtitle
            );


            if (
              Array.isArray(list)
            ) {

              list.forEach(
                item => {

                  const row =
                    document.createElement(
                      "div"
                    );


                  row.className =
                    "result-item";


                  row.textContent =
                    "✓ " + item;


                  block.appendChild(
                    row
                  );

                }
              );

            }

          }
        );

      }


      result.appendChild(
        block
      );

    }
  );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2600
  );

}


/* =====================================================
   START
===================================================== */

renderTrips();

</script>

</body>
</html>
